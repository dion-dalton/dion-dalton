<svg
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Fundo inspirado no GitHub Dark -->
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1">

      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111820"/>

    </linearGradient>


    <!-- Verde inspirado no GitHub -->
    <linearGradient
      id="green"
      x1="0"
      y1="0"
      x2="1"
      y2="0">

      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#56d364"/>

    </linearGradient>


    <!-- Brilho suave -->
    <filter id="softGlow">

      <feGaussianBlur
        stdDeviation="3"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- Grade discreta -->
    <pattern
      id="grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse">

      <path
        d="M 32 0 L 0 0 0 32"
        fill="none"
        stroke="#30363d"
        stroke-width="1"
        opacity="0.35"/>

    </pattern>

  </defs>


  <!-- ====================================================== -->
  <!-- FUNDO                                                   -->
  <!-- ====================================================== -->

  <rect
    width="1200"
    height="300"
    rx="12"
    fill="url(#background)"/>


  <!-- Grade extremamente discreta -->

  <rect
    width="1200"
    height="300"
    rx="12"
    fill="url(#grid)"
    opacity="0.45"/>


  <!-- ====================================================== -->
  <!-- LINHA DECORATIVA LATERAL                                -->
  <!-- ====================================================== -->

  <rect
    x="70"
    y="55"
    width="3"
    height="190"
    rx="2"
    fill="url(#green)"
    filter="url(#softGlow)"/>


