<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="300"
  viewBox="0 0 1200 300">

  <defs>

    <!-- Fundo GitHub Dark -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>

    <!-- Verde GitHub -->
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#56d364"/>
    </linearGradient>

    <!-- Grade -->
    <pattern
      id="grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse">

      <path
        d="M32 0H0V32"
        fill="none"
        stroke="#30363d"
        stroke-width="1"
        opacity=".35"/>

    </pattern>

    <!-- Brilho -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- FUNDO                                             -->
  <!-- ================================================= -->

  <rect
    width="1200"
    height="300"
    rx="12"
    fill="url(#bg)"/>

  <rect
    width="1200"
    height="300"
    rx="12"
    fill="url(#grid)"
    opacity=".45"/>


  <!-- ================================================= -->
  <!-- LINHA LATERAL                                     -->
  <!-- ================================================= -->

  <rect
    x="70"
    y="55"
    width="3"
    height="190"
    rx="2"
    fill="url(#green)"
    filter="url(#glow)"/>


  <!-- ================================================= -->
  <!-- PARTÍCULAS                                       -->
  <!-- ================================================= -->

  <g fill="#3fb950">

    <!-- superiores -->

    <circle cx="780" cy="42" r="1.3">
      <animate attributeName="opacity"
        values=".1;.9;.1"
        dur="2.4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="815" cy="78" r="1.8" fill="#56d364">
      <animate attributeName="opacity"
        values=".8;.15;.8"
        dur="3.1s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="850" cy="55" r="1.5" fill="#56d364">
      <animate attributeName="opacity"
        values=".15;1;.15"
        dur="2.2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="880" cy="35" r="1.2">
      <animate attributeName="opacity"
        values=".7;.1;.7"
        dur="3.7s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="925" cy="48" r="1.7" fill="#56d364">
      <animate attributeName="opacity"
        values=".2;1;.2"
