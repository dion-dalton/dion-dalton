    </circle>

    <circle cx="970" cy="180" r="1.5" fill="#56d364">
      <animate attributeName="opacity"
        values=".2;.9;.2"
        dur="3.4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1010" cy="220" r="1.2">
      <animate attributeName="opacity"
        values=".1;.8;.1"
        dur="2.8s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1050" cy="190" r="1.6" fill="#56d364">
      <animate attributeName="opacity"
        values=".8;.15;.8"
