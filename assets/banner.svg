    </circle>

    <circle cx="940" cy="110" r="1.2">
      <animate attributeName="opacity"
        values=".8;.1;.8"
        dur="3.3s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="975" cy="145" r="1.7" fill="#56d364">
      <animate attributeName="opacity"
        values=".2;1;.2"
        dur="2.5s"
