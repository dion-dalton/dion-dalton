        dur="2.6s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ================================================= -->
  <!-- 3 PONTOS PRINCIPAIS                              -->
  <!-- ================================================= -->

  <g filter="url(#glow)">

    <circle cx="1080" cy="65" r="3" fill="#238636">
      <animate
        attributeName="opacity"
        values=".25;1;.25"
        dur="3s"
        repeatCount="indefinite"/>

      <animate
        attributeName="r"
        values="2.5;4;2.5"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>


    <circle cx="1110" cy="95" r="3" fill="#3fb950">
      <animate
        attributeName="opacity"
        values="1;.2;1"
        dur="4s"
        repeatCount="indefinite"/>

      <animate
        attributeName="r"
        values="2.5;4;2.5"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>


    <circle cx="1140" cy="125" r="3" fill="#56d364">
      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="2.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="r"
        values="2.5;4;2.5"
        dur="2.5s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ================================================= -->
  <!-- CONTEÚDO                                           -->
  <!-- ================================================= -->

  <text
    x="105"
    y="105"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="42"
    font-weight="700"
    fill="#3fb950">
    DION DALTON
  </text>


  <text
    x="105"
    y="155"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="21"
    fill="#8b949e">
    Prototipador Tecnológico
  </text>


  <text
    x="105"
    y="190"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="15"
    fill="#58a6ff">
    Python • AI &amp; Chatbots • Cybersecurity
  </text>


  <text
    x="105"
    y="215"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="15"
    fill="#8b949e">
    Tecnologias Emergentes • Design Thinking
  </text>


  <!-- Terminal -->

  <text
    x="105"
    y="255"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="14"
    fill="#3fb950">
    &gt; transformando ideias em tecnologia
  </text>


  <!-- Cursor -->

  <rect
    x="397"
    y="244"
    width="8"
    height="16"
    rx="1"
    fill="#3fb950">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1.1s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- BORDA                                              -->
  <!-- ================================================= -->

  <rect
    x=".5"
    y=".5"
    width="1199"
    height="299"
    rx="12"
    fill="none"
    stroke="#30363d"
    stroke-width="1"/>

</svg>
