    </circle>

    <circle cx="995" cy="60" r="1.6" fill="#56d364">
      <animate attributeName="opacity"
        values=".7;.15;.7"
        dur="2.4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1030" cy="38" r="1.3" fill="#238636">
      <animate attributeName="opacity"
        values=".15;1;.15"
        dur="3.2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1050" cy="45" r="1.4">
      <animate attributeName="opacity"
        values=".9;.2;.9"
        dur="2.8s"
        repeatCount="indefinite"/>
    </circle>


    <!-- centrais -->

    <circle cx="800" cy="115" r="1.2" fill="#56d364">
      <animate attributeName="opacity"
        values=".2;.9;.2"
